  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I'm a wildlife biologist at James Cook University in Townsville, working at the
      intersection of field ecology and computational data science. My work focuses on
      passive acoustic monitoring and building high-throughput pipelines that turn terabytes
      of raw soundscape recordings into usable ecological data.

      I develop and evaluate species call recognisers. Alongside that, I love going hiking and spending time in nature.
      Eventhough herpetology is my main passion I've begun to appreciate and cherish all kinds of wildlife and flora and 
      start to consider myself a naturalist.
      
    skills:
      enable: false
      title: "Tools and methods I work with:"
      items:
        - "Fauna survey/identification"
        - "Bird survey/bird banding"
        - "Vegetation assessment"
        - "Acoustic monitoring"
        - "Live animal trapping"
        - "Camera trapping"
