  experience:
    enable: true
    items:
      - company: "James Cook University"
        companyUrl: "https://vertecolab.weebly.com/"
        jobs:
          - name: "Postdoctoral Research Fellow"
            date: "2025 - present"
            info:
              content: Ecoacoustics and bioacoustic data engineering
            content: |
              Leading bioacoustic data pipeline development for large-scale biodiversity
              monitoring across northern Australia.

              - Built and maintain high-throughput processing pipelines in R and Bash on HPC infrastructure.
              - Developed semi-automated species recognisers with class-specific detection thresholds.
              - Coordinate validation datasets and external annotator workflows.
              - Oversee publication workflows for ecological manuscripts.

  education:
    enable: true
    index: false
    items:
      - title: "PhD in Ecology/Ecoacoustics"
        school:
          name: "James Cook University"
          url: "https://www.jcu.edu.au"
        date: "2020 - 2024"
        content: |-
          *The value of sound: Passive acoustic monitoring for terrestrial vertebrate biodiversity assessments*

          Conducted research on the value of passive acoustic monitoring to enhance terrestrial vertebrate biodiversity assessments.
          Focused on optimising field survey design and data analysis to enable cost-effective large-scale and long-term 
          monitoring of biodiversity
      - title: "Honours (Behavioural Biology)"
        school:
          name: "Macquarie University"
          url: "https://www.mq.edu.au/"
        date: "2018"
        content: |-
          *To Go, or Not to Go, That Is the Question: Motor self-regulation in the Egernia group*

          Studied the relationship between social behaviour and cognitive abilities of five Australian skinks
      - title: "Bachelor of Science (Biology)"
        school:
          name: "Freie Universität Berlin"
          url: "https://www.fu-berlin.de/en/index.html"
        date: "2015 - 2018"
        content: |-
          Graduated with High Distinction (top 5% of class) and received two highly competitive scholarships.
          Established a partnership between the university’s scholarship program and the Leibniz Institute for Zoo and Wildlife Research
          (IZW) and managed a film project focused on science communication

